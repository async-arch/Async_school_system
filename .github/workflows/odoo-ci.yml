name: Odoo Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env and odoo config templates
        run: |
          cp .env.example .env
          cp config/odoo.conf.example config/odoo.conf

      - name: Start containers
        run: docker compose up -d

      - name: Wait for Odoo to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8070/web/login && exit 0
            echo "Waiting for Odoo... ($i/30)"
            sleep 5
          done
          echo "Odoo did not become ready in time"
          exit 1

      - name: Install Odoo 19 module with demo data and run tests
        # A throwaway container, not `exec`: the service container already holds
        # port 8069, so a second Odoo inside it cannot start.
        run: |
          docker compose run --rm --no-deps -T odoo \
            odoo -c /etc/odoo/odoo.conf -d ci_test_db \
            -i school_management \
            --test-enable --test-tags /school_management \
            --no-http --stop-after-init

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs odoo
          docker compose logs db

      - name: Tear down
        if: always()
        run: docker compose down -v
