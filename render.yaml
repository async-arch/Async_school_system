# Render Blueprint for the shared staging environment.
#
# Staging only — not production. See docs/STAGING.md for first-time setup and
# for the free-tier limitations this deliberately accepts.
#
# No secret values live in this file. Everything marked `sync: false` is entered
# once in the Render dashboard and never committed.
services:
  - type: web
    name: async-school-staging
    runtime: docker
    plan: free
    # Match the Neon region. Odoo issues many queries per page, so putting the
    # app and the database on different continents is felt on every click.
    region: ohio
    branch: main
    # Staging tracks main. Feature branches are tested locally and reviewed in a
    # PR; they never deploy here.
    autoDeploy: true

    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Bypasses the base image's entrypoint, which would otherwise read Render's
    # PORT as the PostgreSQL port. See the header of scripts/render-start.sh.
    dockerCommand: /usr/local/bin/render-start.sh

    # Returns 200 {"status": "pass"} without a session. It does reach the
    # database, so it stays 500 until the database has been initialized — see
    # ODOO_INIT below and docs/STAGING.md.
    healthCheckPath: /web/health

    envVars:
      # ---- Neon PostgreSQL -------------------------------------------------
      # Use the DIRECT / UNPOOLED host, i.e. NOT the "-pooler" one. Odoo keeps
      # session state and the demo seeder takes a pg_advisory_xact_lock, which
      # transaction pooling breaks.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      # Not pinned here: the database is named per environment — Neon hands a
      # new project a `neondb` by default, and an existing service may already
      # be on another name. Hard-coding one meant syncing this blueprint would
      # repoint a running service at a database that does not exist.
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ---- Odoo ------------------------------------------------------------
      # Master password guarding database create/drop/duplicate. Not the login.
      - key: ODOO_ADMIN_PASSWD
        sync: false

      # ODOO_INIT is deliberately not declared here. It is set by hand in the
      # dashboard for a single deploy to initialize an empty database, then
      # removed. See docs/STAGING.md.
